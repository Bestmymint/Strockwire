name: Sync course repositories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockwise-course-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # Mirrored workflow copies must not recursively synchronize.
    if: github.repository == 'athikarn5678/stockwise'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full canonical StockWise history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preserve complete commit ancestry and sync private course repositories
        shell: bash
        env:
          COURSE_SYNC_TOKEN: ${{ secrets.COURSE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${COURSE_SYNC_TOKEN}" ]]; then
            echo "::error::Set COURSE_SYNC_TOKEN in the public stockwise repo's Actions secrets."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$COURSE_SYNC_TOKEN" | base64 -w 0)"
          source_dir="$GITHUB_WORKSPACE"
          source_commit="$(git -C "$source_dir" rev-parse HEAD)"
          source_short="${source_commit:0:12}"

          mirror() {
            local target="$1" header="$2" tmp dest
            tmp="$(mktemp -d)"
            dest="$tmp/repo"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              clone --quiet --branch main "https://github.com/${target}.git" "$dest"

            # Fetch from the checked-out canonical source: full original commit
            # objects and SHA identities, not just the latest source snapshot.
            git -C "$dest" fetch --quiet --no-tags "$source_dir" \
              "$source_commit:refs/remotes/stockwise-source/main"

            git -C "$dest" config user.name "stockwise-sync[bot]"
            git -C "$dest" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if ! git -C "$dest" merge-base --is-ancestor "$source_commit" HEAD; then
              # The destination retains its course-specific README and existing
              # history. Record source history as a second parent without
              # rewriting/force-pushing any existing destination commits.
              git -C "$dest" merge --no-ff --no-commit \
                --allow-unrelated-histories -s ours "$source_commit"
            fi

            # Keep all tracked source files identical, except root README.
            rsync --archive --delete \
              --exclude='/.git/' \
              --exclude='/README.md' \
              "$source_dir/" "$dest/"
            {
              cat "$source_dir/$header"
              cat "$source_dir/README.md"
            } > "$dest/README.md"

            git -C "$dest" add --all
            if git -C "$dest" rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git -C "$dest" commit --quiet -m "chore(sync): include StockWise $source_short history"
            elif ! git -C "$dest" diff --cached --quiet; then
              git -C "$dest" commit --quiet -m "chore(sync): StockWise $source_short"
            else
              echo "Already up to date: $target"
            fi

            if ! git -C "$dest" merge-base --is-ancestor "$source_commit" HEAD; then
              echo "::error::Source history is not present in $target"
              exit 1
            fi
            git -C "$dest" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push --quiet origin HEAD:main
            echo "Synchronized $target; source commit $source_short is an ancestor."
            rm -rf "$tmp"
          }

          mirror "athikarn5678/stockwise-cloud-computing-06016404" \
            ".github/course-readmes/cloud-computing.md"
          mirror "athikarn5678/stockwise-server-side-web-development-06016418" \
            ".github/course-readmes/server-side-web-development.md"
